[project]
name = "gatekeeper"
version = "0.1.0"
description = "Staff access control with face recognition"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "insightface>=0.7",
    "onnxruntime>=1.16",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "scipy>=1.10",
    "pyobjc-framework-AVFoundation>=9; sys_platform == 'darwin'",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",  # fastapi.testclient
]

[tool.uv]
# A set of scripts run from this directory, not an installable package.
package = false
